site_name: TT426 Kullanım Rehberi
site_description: TT426 makinesi için operatör rehberi
site_url: https://hm-info.github.io/tt426/

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: tr
  features:
    - navigation.expand
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      primary: blue-grey
      accent: blue-grey

nav:
  - Türkçe:
      - Başlangıç: index.md
      - Kesim:
          - Kısa kesim sonrası baskılar: short_cut_clamps_tr.md
  - English:
      - Getting Started: home-en.md
      - Cutting:
          - Clamps after a short cut: short_cut_clamps_en.md

use_directory_urls: false

plugins:
  - search

markdown_extensions:
  - md_in_html
  - tables
  - attr_list
  - admonition

hooks:
  - hooks/pdf_export.py
  - hooks/navigation.py

extra:
  alternate:
    - name: Türkçe
      link: index.html
      lang: tr
    - name: English
      link: home-en.html
      lang: en

extra_css:
  - stylesheets/guide.css
  - stylesheets/downloads.css
